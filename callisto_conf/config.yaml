chain:
  # Bech32 prefix for addresses on Safrochain
  bech32_prefix: addr_safro

  # List of Cosmos SDK modules to enable (order matters)
  modules:
    - modules # Must always come first
    - message_type # Must run before messages to satisfy message_type FK
    - messages # Keep near the top for tx/message parsing
    - auth # Parse accounts, signatures, authorizations
    - bank # Parse balances, transfers
    # - consensus # Disable unless genesis is parsed
    - staking # Parse validators, delegations
    - distribution # Parse rewards, commissions (must come after staking)
    - feegrant # Parse fee grants
    - gov # Parse proposals, votes
    - mint # Parse inflation data
    - slashing # Parse slashing events
    - upgrade # Parse software upgrades
    - wasm # Enable if Safrochain uses CosmWasm
    # - pricefeed    # Enable if you want price tracking
    # - pruning      # Enable if you want periodic DB pruning

node:
  # BDJuno reads data from a running node (remote)
  type: remote
  config:
    rpc:
      client_name: safrochain
      # CometBFT RPC: HTTP on 26657
      address: http://88.99.211.113:26657
      max_connections: 20
    grpc:
      # gRPC: host:port only
      address: 88.99.211.113:9090
      insecure: true

parsing:
  workers: 1 # Use 1 worker to avoid race conditions
  # Node has pruned old state; only index new blocks going forward.
  start_height: 1
  average_block_time: 5s # Adjust to your chain’s block time
  listen_new_blocks: true
  parse_old_blocks: false # Node has pruned old blocks; don't backfill
  parse_genesis: false    # Node doesn't serve genesis state
  fast_sync: false

database:
  url: postgresql://safrochain_indexuser:rootroot@localhost:5432/safrochain_indexdb?sslmode=disable&search_path=public
  max_open_connections: 10
  max_idle_connections: 5
  partition_size: 100000
  partition_batch: 1000
  ssl_mode_enable: "false"
  ssl_root_cert: ""
  ssl_cert: ""
  ssl_key: ""

logging:
  level: debug # verbose | debug | info | warn | error
  format: text # text or json

telemetry:
  enabled: true
  port: 5000

pruning:
  keep_recent: 100
  keep_every: 500
  interval: 10

actions:
  host: 127.0.0.1
  port: 3000
  node:
    rpc:
      address: http://88.99.211.113:26657
    grpc:
      address: 88.99.211.113:9090
      insecure: true
